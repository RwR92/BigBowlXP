<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="login.css">

</head>
<body class="login-page">
<section class="login">
    <form id="loginForm">
        <header>
            <h1>Login</h1>
        </header>
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="enter admin or employee" required>
        </div>
       <div>
           <label for="password">Password:</label>
           <input type="password" id="password" name="password" placeholder="enter admin or employee" required>
       </div>

        <button>Submit</button>
    </form>
</section>
<script type="module" src="login.js"></script>
</body>
</html>
