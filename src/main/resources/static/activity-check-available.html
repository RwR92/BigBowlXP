<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledige tider</title>

</head>

<body data-role="employee">
<button id="logout-btn">Logout</button>
<h1>Ledige tider</h1>

<div class="search-form">

  <div>
    <label for="type">Aktivitet</label>
    <select id="type" required>
      <option value="">Vælg aktivitet</option>
      <option value="BOWLING">Bowling</option>
      <option value="AIRHOCKEY">Airhockey</option>
    </select>
  </div>

  <div>
    <label for="date">Dato</label>
    <input type="date" id="date" required>
  </div>

  <button id="loadAvailable">Vis ledige tider</button>

</div>

<table>
  <thead>
  <tr>
    <th>Tidsrum</th>
    <th>Antal ledige baner</th>
    <th>Ledige banenumre</th>
  </tr>
  </thead>
  <tbody id="availabilityTableBody">
  </tbody>
</table>

<script type="module" src="activityCheckAvailable.js">
</script>

</body>
</html>
