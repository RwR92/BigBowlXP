<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservations</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-role="employee">

<h1>Reservations</h1>


<!-- ========================================
     RESERVATIONS TABLE
========================================= -->

<div class="reservations">

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Activities</th>
            <th>Action</th>
        </tr>

        </thead>


        <tbody id="reservationTableBody">
        </tbody>

    </table>

</div>



<!-- ========================================
     ADD RESERVATION
========================================= -->

<div class="reservation-form">

    <h2>Add Reservation</h2>


    <form id="reservationForm">


        <!-- Reservation name -->

        <div>

            <label for="reservationName">
                Customer Name
            </label>

            <input
                    type="text"
                    id="reservationName"
                    required>

        </div>


        <!-- Activities -->

        <h3>Activities</h3>

        <div id="activitiesContainer">
        </div>


        <!-- Add activity -->

        <button
                type="button"
                id="addActivityButton">

            + Add Activity

        </button>


        <br>
        <br>


        <!-- Submit reservation -->

        <button type="submit">

            Add Reservation

        </button>


    </form>

</div>


<script type="module" src="activities.js"></script>

</body>

</html>
