<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations</title>

    <link rel="stylesheet" href="reservationStyle.css">
</head>

<body data-role="employee">

<h1>Reservations</h1>

<div class="reservations">

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Guests</th>
            <th>Type</th>
            <th>Lane</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody id="reservationTableBody">
        </tbody>

    </table>

</div>

<div class="reservation-form">

    <h2>Add Reservation</h2>

    <form id="reservationForm">

        <div>
            <label for="startTime">Start Time</label>

            <input
                    type="datetime-local"
                    id="startTime"
                    required>
        </div>


        <div>
            <label for="endTime">End Time</label>

            <input
                    type="datetime-local"
                    id="endTime"
                    required>
        </div>


        <div>
            <label for="guests">Guests</label>

            <input
                    type="number"
                    id="guests"
                    min="1"
                    required>
        </div>


        <div>
            <label for="type">Type</label>

            <select id="type" required>
                <option value="">Choose type</option>
                <option value="BOWLING">Bowling</option>
                <option value="AIRHOCKEY">Airhockey</option>
                <option value="DINING">Dining</option>
            </select>
        </div>


        <div>
            <label for="laneId">Lane ID</label>

            <input
                    type="number"
                    id="laneId"
                    min="1"
                    required>
        </div>


        <button type="submit">
            Add Reservation
        </button>

    </form>

</div>

<script type="module" src="../activities.js"></script>

</body>
</html>
